# Daily: probe a rotating batch of representative IPs against judgeip.com so the rolling
# 30-day ranking sample keeps growing and existing samples keep their validity refreshed.
# The probes are real full lookups — the same scores real users would get — just automated.
name: Nurture rankings

on:
  schedule:
    # 错开 IPsum 的 03:20 UTC，避免两个任务同时打上游；12 IP × 8s ≈ 2 分钟跑完
    - cron: '40 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nurture-rankings
  cancel-in-progress: false

jobs:
  nurture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Probe today's batch
        run: node --experimental-strip-types scripts/nurture-rankings.ts
