name = "judgeip"
main = "./src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
# 这些路径先进 Worker，由 src/worker.ts 拒绝外部下载；服务端经 ASSETS 绑定读取不受影响
run_worker_first = ["/assets/data/ipsum*"]

[observability]
enabled = true

# Optional KV namespace binding for caching upstream IP intelligence lookups
# Uncomment after running: `npx wrangler kv namespace create IP_CACHE`
# [[kv_namespaces]]
# binding = "IP_CACHE"
# id = "YOUR_KV_NAMESPACE_ID"

[vars]
PUBLIC_SITE_URL = "https://judgeip.com"
